<!DOCTYPE html>
<html lang="th">

<head>

        body {

            padding: 20px;

        .paper {
            background: #fff;
            border: 1px solid #000;

            margin-bottom: 30px;
            position: relative;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
            color: #000000;
        }

        .doc-ctrl-top {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 10px;
            font-weight: bold;
            color: #000000;
        }

        .doc-ctrl-bottom {
            position: absolute;
            bottom: 12px;
            right: 20px;
            font-size: 10px;
            font-weight: bold;
            color: #000000;
        }

        .title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;

            margin-bottom: 15px;

        }

        table {
            width: 100% !important;

            margin-bottom: 12px;

        th,
        td {

        th {

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        const webAppUrl = "https://script.google.com/macros/s/AKfycbxj_vAOeB1SWtQfgXtuI4Mz6dKqJes_kvVLg4KKWkwtQ271-Ajb5bW60x4x4KTQDlESdw/exec";
        let datePickerInstance;

        window.onload = function () {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');

            datePickerInstance = flatpickr("#filterDate", {
                dateFormat: "d/m/Y",
                defaultDate: `${dd}/${mm}/${yyyy}`,
                onChange: function (selectedDates, dateStr, instance) {
                    loadData();
                }
            });

            loadData();
        };

        function clearDateFilter() {
            if (datePickerInstance) {
                datePickerInstance.clear();
            }
            // ล้างค่าในช่องค้นหาเครื่องจักรด้วย
            document.getElementById("filterMachine").value = "";
            loadData();
        }

        function parseSheetDate(dateStr) {
            if (!dateStr) return null;
            let str = String(dateStr).trim();

            if (str.includes(" ") && (str.includes("GMT") || isNaN(str))) {
                const d = new Date(str);
                if (!isNaN(d.getTime())) {
                    return d;
                }
            }

            let cleanStr = str.split(" ")[0];

            if (cleanStr.includes("/")) {
                let parts = cleanStr.split("/");
                if (parts.length === 3) {
                    if (parts[0].length === 4) {
                        return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                    }

                    let p0 = parseInt(parts[0], 10);
                    let p1 = parseInt(parts[1], 10);
                    let p2 = parseInt(parts[2], 10);

                    if (str.includes("Oct") && p1 === 6) {
                        return new Date(p2, 5, 10);
                    }

                    return new Date(p2, p1 - 1, p0);
                }
            } else if (cleanStr.includes("-")) {
                let parts = cleanStr.split("-");
                if (parts.length === 3) {
                    if (parts[0].length === 4) {
                        return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                    }
                    return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
                }
            }

            const fallbackDate = new Date(str);
            return !isNaN(fallbackDate.getTime()) ? fallbackDate : null;
        }

        function cleanDisplayDate(dateStr) {
            const parsed = parseSheetDate(dateStr);
            if (!parsed) return String(dateStr);
            let day = String(parsed.getDate()).padStart(2, '0');
            let month = String(parsed.getMonth() + 1).padStart(2, '0');
            let year = parsed.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function getStandardDateStr(dateStr) {
            const parsed = parseSheetDate(dateStr);
            if (!parsed) return "";
            let day = String(parsed.getDate()).padStart(2, '0');
            let month = String(parsed.getMonth() + 1).padStart(2, '0');
            let year = parsed.getFullYear();
            return `${year}-${month}-${day}`;
        }

        function getMonthThaiName(dateStr) {
            const parsed = parseSheetDate(dateStr);
            if (!parsed) return "";
            const monthNamesThai = [
                "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
                "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
            ];
            return monthNamesThai[parsed.getMonth()];
        }

        function formatTimeStr(timeStr) {
            if (!timeStr) return "";
            let str = String(timeStr).trim();
            if (str.includes("1899") || str.includes("GMT")) {
                const d = new Date(str);
                if (!isNaN(d.getTime())) {
                    let hours = String(d.getHours()).padStart(2, '0');
                    let minutes = String(d.getMinutes()).padStart(2, '0');
                    return `${hours}:${minutes}`;
                }
            }
            if (str.includes(" ")) {
                let parts = str.split(" ");
                let timePart = parts.find(p => p.includes(":"));
                if (timePart) {
                    let tSplit = timePart.split(":");
                    return `${tSplit[0].padStart(2, '0')}:${tSplit[1].padStart(2, '0')}`;
                }
            } else if (str.includes(":")) {
                let tSplit = str.split(":");
                return `${tSplit[0].padStart(2, '0')}:${tSplit[1].padStart(2, '0')}`;
            }
            return str;
        }

        function calculatePlanHours(startStr, endStr) {
            let startTime = formatTimeStr(startStr);
            let endTime = formatTimeStr(endStr);

            if (!startTime || !endTime) return "";

            let startParts = startTime.split(":");
            let endParts = endTime.split(":");

            let startMinutes = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
            let endMinutes = parseInt(endParts[0]) * 60 + parseInt(endParts[1]);

            if (endMinutes < startMinutes) {
                endMinutes += 24 * 60;
            }

            let diffMinutes = endMinutes - startMinutes;
            let hours = diffMinutes / 60;

            return Number(hours.toFixed(1));
        }

        function formatDocNo(docNo) {
            if (docNo === undefined || docNo === null) return "";
            let strDoc = String(docNo).trim();
            return /^\d+$/.test(strDoc) ? strDoc.padStart(4, '0') : strDoc;
        }

        async function loadData() {
            const container = document.getElementById("reportContainer");

            // ดึงค่าวันที่ตัวกรอง
            let selectedDate = "";
            const rawPickerValue = document.getElementById("filterDate").value;
            if (rawPickerValue && rawPickerValue.includes("/")) {
                const parts = rawPickerValue.split("/");
                if (parts.length === 3) {
                    selectedDate = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                }
            }

            // ดึงค่าเครื่องจักรตัวกรอง (แปลงเป็นพิมพ์เล็กเพื่อไม่ให้มีปัญหาเรื่องพิมพ์เล็ก-ใหญ่)
            const filterMachineVal = document.getElementById("filterMachine").value.trim().toLowerCase();

            container.innerHTML = `<div class="text-center p-5">⏳ กำลังดึงข้อมูลล่าสุด...</div>`;

            try {
                const response = await fetch(webAppUrl);
                const data = await response.json();

                if (data.error) {
                    container.innerHTML = `<div class="alert alert-danger">เกิดข้อผิดพลาด: ${data.error}</div>`;
                    return;
                }
                if (data.length === 0) {
                    container.innerHTML = `<div class="alert alert-warning text-center">📭 ไม่พบข้อมูลในระบบ</div>`;
                    return;
                }

                const groupedData = {};
                data.forEach(item => {
                    if (item.docNo) {
                        // 1. ตรวจสอบตัวกรองวันที่
                        if (selectedDate) {
                            const itemDateStr = getStandardDateStr(item.docDate);
                            if (itemDateStr !== selectedDate) return;
                        }

                        // 2. ตรวจสอบตัวกรองเครื่องจักร (เพิ่มเข้ามาใหม่)
                        if (filterMachineVal) {
                            const itemMachineStr = String(item.machineNo || '').toLowerCase();
                            if (!itemMachineStr.includes(filterMachineVal)) return;
                        }

                        const finalDocNo = formatDocNo(item.docNo);
                        if (!groupedData[finalDocNo]) {
                            groupedData[finalDocNo] = {
                                docDate: cleanDisplayDate(item.docDate),
                                rawDocDate: item.docDate,
                                machineNo: item.machineNo,
                                docNo: finalDocNo,
                                orderedBy: item.orderedBy,
                                recordedBy: item.recordedBy,
                                plans: []
                            };
                        }
                        groupedData[finalDocNo].plans.push(item);
                    }
                });

                if (Object.keys(groupedData).length === 0) {
                    let textAlert = `📭 ไม่พบข้อมูลรายงาน`;
                    if (rawPickerValue) textAlert += ` ในวันที่เลือก (${rawPickerValue})`;
                    if (filterMachineVal) textAlert += ` ของเครื่องจักร (${document.getElementById("filterMachine").value})`;
                    container.innerHTML = `<div class="alert alert-warning text-center">${textAlert}</div>`;
                    return;
                }

                container.innerHTML = "";

                for (let docNo in groupedData) {
                    const doc = groupedData[docNo];
                    let tableRows = "";
                    let totalRowsCount = 10;

                    for (let i = 0; i < totalRowsCount; i++) {
                        if (doc.plans[i]) {
                            let plan = doc.plans[i];
                            let autoHours = calculatePlanHours(plan.planStart, plan.planEnd);
                            let displayActualStart = formatTimeStr(plan.actualStart || '');
                            let displayActualEnd = formatTimeStr(plan.actualEnd || '');

                            tableRows += ` <tr> <td>${plan.customer || ''}</td> <td>${plan.productSize || ''}</td> <td>${plan.materialColor || ''}</td> <td>${plan.qtyPcs || ''}</td> <td>${plan.qtyBox || ''}</td> <td>${plan.lotPreform || ''}</td> <td>${plan.lotBag || ''}</td> <td>${formatTimeStr(plan.planStart)}</td> <td>${formatTimeStr(plan.planEnd)}</td> <td class="fw-bold" style="color: #000000;"> ${autoHours} </td> <td>${displayActualStart}</td> <td>${displayActualEnd}</td> <td>${plan.actualQty || ''}</td> <td>${plan.goodQty || ''}</td> <td>${plan.rejectBottle || ''}</td> <td>${plan.rejectPreform || ''}</td> <td>${plan.rejectPercent || ''}</td> <td>${plan.remark || ''}</td> </tr>`;
                        } else {
                            tableRows += `
                            <tr>
                                <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
                                <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
                                <td></td><td></td><td></td><td></td>
                            </tr>`;
                        }
                    }

                    let monthThai = getMonthThaiName(doc.rawDocDate);
                    let htmlPaper = `
                    <div class="paper">
                        <div class="doc-ctrl-top">QF-PD-01-01 Rev.04</div>
                        <div class="title">ใบรายงานการสั่งงานผลิต ขวด PET</div>
                        
                        <table class="header-table">
                            <tr>
                                <td style="width:22%;">วันที่ผลิต: <span style="color: #000000;">${doc.docDate}</span></td>
                                <td style="width:15%;">เครื่องจักร: <span style="color: #000000;">${doc.machineNo || ''}</span></td>
                                <td style="width:23%;">เลขที่เอกสาร: <span style="color: #000000;">${doc.docNo}</span></td>
                                <td style="width:20%;">ผู้บันทึก: <span style="color: #000000;">${doc.recordedBy || ''}</span></td>
                                <td style="width:20%;">ผู้สั่งงาน: <span style="color: #000000;">${doc.orderedBy || ''}</span></td>
                            </tr>
                        </table>

                        <table class="main-report-table">
                            <thead>
                                <tr>
                                    <th rowspan="2" style="width:6%;">STOCK</th>
                                    <th rowspan="2" style="width:11%;">ผลิตภัณฑ์/ขนาด</th>
                                    <th rowspan="2" style="width:5%;">วัตถุดิบ/สี</th>
                                    <th colspan="2" style="width:8%;">จำนวนที่สั่งผลิต</th>
                                    <th colspan="2" style="width:10%;">Lot No</th>
                                    <th colspan="3" style="width:10%;">ระยะเวลาที่วางแผน</th>
                                    <th colspan="2" style="width:12%;">ระยะเวลาที่ผลิตจริง</th>
                                    <th rowspan="2" style="width:7%;">จำนวนผลิตจริง</th>

                                    <th rowspan="2" style="width:10%;">หมายเหตุ</th>
                                </tr>
                                <tr>
                                    <th>กล่อง</th>

                                    <th>ถุง</th>
                                    <th>เริ่ม</th>
                                    <th>สิ้นสุด</th>
                                    <th>ชม.</th>
                                    <th style="width:60px;">เริ่ม</th>
                                    <th style="width:60px;">สิ้นสุด</th>
                                    <th style="width:60px;">ขวด</th>
                                    <th style="width:30px;">พรีฟอร์ม</th>
                                    <th style="width:60px;">%</th>
                                </tr>
                            </</head>
                            <tbody>
                                ${tableRows}
                            </tbody>
                        </table>

                        <div class="employee-section-row">

                                        <tr>
                                            <th colspan="5" style="padding: 6px; font-size: 13px; font-weight: bold; background-color: #f8f9fa;">
                                                รายละเอียดพนักงานประจำเครื่อง (กะเช้า)
                                            </th>
                                        </tr>

                                            <th rowspan="2" style="width: 8%; vertical-align: middle;">ลำดับ</th>
                                            <th rowspan="2" style="width: 46%; vertical-align: middle;">ชื่อ-สกุล พนักงาน/ช่าง/คิวซี</th>
                                            <th colspan="2" style="width: 31%;">เวลาทำงาน : ชั่วโมง</th>
                                            <th rowspan="2" style="width: 15%; vertical-align: middle;">รวมผลิตได้</th>
                                        </tr>
                                        <tr>
                                            <th style="width: 15.5%;">เวลาเข้า</th>
                                            <th style="width: 15.5%;">เวลาออก</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr><td>1</td><td></td><td></td><td></td><td></td></tr>
                                        <tr><td>2</td><td></td><td></td><td></td><td></td></tr>
                                        <tr><td>3</td><td></td><td></td><td></td><td></td></tr>
                                        <tr><td>4</td><td></td><td></td><td></td><td></td></tr>
                                        <tr><td>5</td><td></td><td></td><td></td><td></td></tr>
                                    </tbody>
                                </table>
                            </div>
                            
                            <div class="employee-table-container">
                                <table class="text-center">
                                    <thead>
                                        <tr>
                                            <th colspan="5" style="padding: 6px; font-size: 13px; font-weight: bold; background-color: #f8f9fa;">
                                                รายละเอียดพนักงานประจำเครื่อง (กะดึก)
                                            </th>
                                        </tr>
                                        <tr>
                                            <th rowspan="2" style="width: 8%; vertical-align: middle;">ลำดับ</th>
                                            <th rowspan="2" style="width: 46%; vertical-align: middle;">ชื่อ-สกุล พนักงาน/ช่าง/คิวซี</th>
                                            <th colspan="2" style="width: 31%;">เวลาทำงาน : ชั่วโมง</th>
                                            <th rowspan="2" style="width: 15%; vertical-align: middle;">รวมผลิตได้</th>

                                        <tr>

                                    </thead>

                            </div>
                        </div>
                                                
                        <div class="doc-ctrl-bottom">ประกาศใช้เมื่อวันที่ : 9 มิถุนายน 2569</div>
                        <div class="btn-print-row text-end mt-2">
                            <button class="btn btn-sm btn-secondary" onclick="window.print()">🖨️ พิมพ์เฉพาะใบนี้</button>
                        </div>
                    </div>`;

                    container.insertAdjacentHTML("beforeend", htmlPaper);
                }

            } catch (error) {
                container.innerHTML = `<div class="alert alert-danger">ไม่สามารถเชื่อมต่อระบบได้: ${error}</div>`;
                console.error(error);
            }
        }
    </script>
